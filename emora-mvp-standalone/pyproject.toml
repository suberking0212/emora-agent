[project]
name = "emora-mvp-standalone"
version = "0.1.0"
description = "Standalone Emora emotional reflection MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1,<2",
  "openai>=1.50,<3",
  "sqlalchemy>=2.0,<3",
  "langgraph==1.2.18",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
