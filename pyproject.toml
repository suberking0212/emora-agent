[project]
name = "emotional-agent"
version = "0.1.0"
description = "CLI communication review assistant"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7.4,<3",
  "pydantic-settings>=2.2,<3",
  "typer>=0.12,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  "langgraph==1.2.16",
  "langgraph-checkpoint-postgres>=2.0,<4",
  "langchain-openai>=0.3,<2",
  "keyring>=25,<27",
  "Pillow>=10,<13",
  "jsonschema>=4.22,<5",
]

[project.scripts]
emotional-agent = "packages_py.cli.main:app"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.6,<1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
lint.ignore = ["B008", "BLE001", "TRY004"]
